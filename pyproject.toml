[project]
name = "funtalk"
version = "1.0.31"
description = "funtalk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts~=6.1.10",
    "funutil",
    "moviepy",
    "openai-whisper",
    "tqdm",
]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funtalk"
Releases = "https://github.com/farfarfun/funtalk/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]

[dependency-groups]
dev = [
    "pytest",
]
