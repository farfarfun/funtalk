[project]
name = "funtalk"
version = "1.0.31"
description = "funtalk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "edge-tts~=6.1.10",
    "farlog>=1.1.7",
    "funutil>=1.0.50",
    "tqdm>=4.66",
]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funtalk"
Releases = "https://github.com/farfarfun/funtalk/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]

[project.optional-dependencies]
tts = ["moviepy>=2.0"]
asr = ["openai-whisper>=20231117"]
azure = ["azure-cognitiveservices-speech>=1.37"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
